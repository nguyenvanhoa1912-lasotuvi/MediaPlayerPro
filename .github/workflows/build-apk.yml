name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cài Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK (debug – cài thẳng lên điện thoại)
        run: gradle :app:assembleDebug --stacktrace

      - name: Đổi tên APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MediaPlayerPro.apk

      - name: Tải APK lên mục Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlayerPro-apk
          path: MediaPlayerPro.apk

      - name: Đăng APK lên Releases (link tải trực tiếp)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MediaPlayerPro.apk \
            --title "Media Player Pro – bản mới nhất" \
            --notes "Build tự động từ commit ${GITHUB_SHA::7}. Tải MediaPlayerPro.apk và cài trực tiếp trên điện thoại."
